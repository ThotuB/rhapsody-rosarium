<!-- The app's icon: the map's rose marker, bloomed as when its piano is tuned in (see ROSE_SVG in
     frontend/src/shared/PianoMap.tsx). appicon.png is rendered from it:
     magick -background none -density 1536 appicon.svg -resize 1024x1024 appicon.png -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-32 -32 64 64" width="1024" height="1024">
  <defs>
    <path id="petal" d="M0 0C-6.5-3-8.5-13 0-17.5C8.5-13 6.5-3 0 0Z" stroke="#fff" stroke-width="0.7" stroke-linejoin="round"/>
  </defs>
  <rect x="-30" y="-30" width="60" height="60" rx="13" fill="#faf7f5"/>
  <g transform="scale(0.78)">
    <g fill="#d6336c">
      <use xlink:href="#petal" transform="rotate(0) scale(1.7)"/>
      <use xlink:href="#petal" transform="rotate(72) scale(1.7)"/>
      <use xlink:href="#petal" transform="rotate(144) scale(1.7)"/>
      <use xlink:href="#petal" transform="rotate(216) scale(1.7)"/>
      <use xlink:href="#petal" transform="rotate(288) scale(1.7)"/>
    </g>
    <g fill="#a8285a">
      <use xlink:href="#petal" transform="rotate(36) scale(1.15)"/>
      <use xlink:href="#petal" transform="rotate(108) scale(1.15)"/>
      <use xlink:href="#petal" transform="rotate(180) scale(1.15)"/>
      <use xlink:href="#petal" transform="rotate(252) scale(1.15)"/>
      <use xlink:href="#petal" transform="rotate(324) scale(1.15)"/>
    </g>
    <circle r="2.8" fill="#7a1d40"/>
  </g>
</svg>
